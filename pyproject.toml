[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satsplat-pers"
version = "1.0.5"
description = "SatSplat for geometrically accurate satellite surface reconstruction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Shuang Song" }, { name = "Jiyong Kim" }, { name = "Rongjun Qin" }]
dependencies = [
    "affine",
    "ephem",
    "gsplat @ git+https://github.com/GDAOSU/gsplat.git@38a65f9ec4320d9c8f7e1cad5c81017bfb682b45",
    "hydra-core==1.3.2",
    "matplotlib",
    "meshio",
    "ninja",
    "numba",
    "numpy",
    "pyproj",
    "rasterio",
    "scipy",
    "tensorboard",
    "torch==2.9.1",
    "torchmetrics",
    "torchvision==0.24.1",
    "tqdm",
]

[project.scripts]
sstrain = "satsplat.entrypoint.train:main"
ssrender = "satsplat.entrypoint.render:main"

[project.urls]
Paper = "https://arxiv.org/abs/2606.28581"
Homepage = "https://gdaosu.github.io/satsplat/"
Demo = "https://gdaosu.github.io/satsplat_html/"

[tool.setuptools.packages.find]
include = ["satsplat*"]

[tool.setuptools.package-data]
satsplat = ["config/*.yaml", "config/dataset/*.yaml", "config/pipeline/*.yaml", "config/pipeline/strategy/*.yaml", "config/pipeline/init_cfg/initializer/*.yaml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ name = "linux-64-cuda-12-6", platform = "linux-64", cuda = "12.6" }]
requires-pixi = ">=0.84.2"

[tool.pixi.dependencies]
python = "3.12.*"
cuda-nvcc = "12.6.*"
cuda-cudart-dev = "12.6.*"
cuda-cccl = "12.6.*"
gcc_linux-64 = "11.*"
gxx_linux-64 = "11.*"

[tool.pixi.pypi-dependencies]
satsplat-pers = { path = ".", editable = true }
torch = { url = "https://download-r2.pytorch.org/whl/cu126/torch-2.9.1%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=67e9b1054f435d33af6fa67343f93d73dc2d37013623672d6ffb24ce39b666c2" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cu126/torchvision-0.24.1%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=987243137be01e8c3e13bde20264c1c3fc22c570f607e19759d92bbc1364a75d" }

[tool.pixi.activation.env]
BUILD_NO_CUDA = "1"
CUDA_HOME = "$CONDA_PREFIX"
CPATH = "$CONDA_PREFIX/targets/x86_64-linux/include"
PYTHONNOUSERSITE = "1"
TORCH_EXTENSIONS_DIR = "$PIXI_PROJECT_ROOT/.pixi/torch_extensions"
MAX_JOBS = "4"
